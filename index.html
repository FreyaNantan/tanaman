<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Website Penanaman</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background-color: #e0f0ff;
      text-align: center;
    }

    header {
      background-color: #b0d4ff;
      padding: 20px;
      border-radius: 10px;
    }

    header h1 {
      font-size: 6vw;
      margin: 0;
    }

    .infografis {
      margin: 30px auto;
      max-width: 800px;
      background-color: #ffffff;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    .infografis img {
      max-width: 100%;
      height: auto;
      margin-bottom: 20px;
      border-radius: 10px;
    }

    .menu {
      margin-top: 30px;
    }

    .menu a button {
      padding: 15px 25px;
      font-size: 16px;
      border-radius: 10px;
      border: none;
      background-color: #8ecaff;
      color: #000;
      cursor: pointer;
      margin: 10px;
      transition: background-color 0.3s;
    }

    .menu a button:hover {
      background-color: #74b9ff;
    }

    @media (max-width: 600px) {
      header h1 {
        font-size: 8vw;
      }

      .menu a button {
        width: 90%;
        font-size: 5vw;
      }

      body {
        padding: 15px;
      }
    }
  </style>
</head>
<body>

  <header>
    <h1>Website Edukasi Penanaman</h1>
  </header>

  <div class="infografis">
    <img src="https://i.imgur.com/W7Q3zHE.jpg" alt="Infografis Penanaman">
    <p><strong>Pelajari cara menanam tumbuhan yang baik dan benar, serta penggunaan pupuk alami dan kimia.</strong></p>
  </div>

  <div class="menu">
    <a href="halaman2.html"><button>🌱 Lanjut ke Video & Simulasi</button></a>
  </div>

</body>
</html>
