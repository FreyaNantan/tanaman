<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Grup Obrolan Penanaman</title>
  <style>
    body {
      background-color: #e0f0ff;
      font-family: Arial, sans-serif;
      padding: 20px;
      margin: 0;
    }

    header {
      background-color: #3399ff;
      color: white;
      padding: 20px;
      text-align: center;
      border-radius: 8px;
    }

    .chat-container {
      max-width: 700px;
      margin: 30px auto;
      background-color: #ffffff;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 0 12px rgba(0, 0, 0, 0.1);
    }

    .chat-log {
      height: 320px;
      overflow-y: auto;
      background: #f7f7f7;
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 20px;
    }

    .pesan {
      display: flex;
      align-items: flex-start;
      margin-bottom: 10px;
      background: #e1f5fe;
      padding: 10px;
      border-radius: 10px;
    }

    .pesan img {
      width: 36px;
      height: 36px;
      margin-right: 10px;
      border-radius: 50%;
    }

    .isi-pesan {
      flex-grow: 1;
    }

    .isi-pesan small {
      color: #555;
      font-size: 12px;
    }

    input, button {
      padding: 10px;
      margin: 5px 0;
      width: 100%;
      box-sizing: border-box;
      font-size: 16px;
      border-radius: 6px;
      border: 1px solid #ccc;
    }

    button {
      background-color: #66cc66;
      color: white;
      border: none;
      cursor: pointer;
    }

    .avatar-preview {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      border: 2px solid #ccc;
      object-fit: cover;
      margin-bottom: 10px;
    }

    .avatar-list img {
      width: 40px;
      height: 40px;
      margin: 5px;
      border-radius: 50%;
      border: 2px solid transparent;
      cursor: pointer;
    }

    .avatar-list img.selected {
      border: 2px solid green;
    }

    @media (max-width: 600px) {
      .chat-log {
        height: 250px;
      }
    }
  </style>
</head>
<body>

  <header>
    <h1>💬 Grup Obrolan Penanaman</h1>
    <p>Diskusi dan tanya jawab seputar penanaman dan pupuk</p>
  </header>

  <div class="chat-container">
    <div class="chat-log" id="chatLog">
      <p><em>Memuat pesan...</em></p>
    </div>

    <input type="text" id="username" placeholder="Nama Anda" />
    
    <label>Pilih Avatar:</label>
    <div class="avatar-list" id="daftarAvatar"></div>

    <label>Atau upload gambar profil:</label><br>
    <input type="file" id="uploadFoto" accept="image/*"><br>
    <img id="previewFoto" class="avatar-preview" src="https://cdn-icons-png.flaticon.com/512/149/149071.png">
    <input type="hidden" id="fotoTerpilih" value="https://cdn-icons-png.flaticon.com/512/149/149071.png">

    <input type="text" id="message" placeholder="Tulis pesan..." />
    <button onclick="kirimPesan()">Kirim</button>
  </div>

  <!-- Tombol kembali ke halaman 2 -->
  <div style="text-align: center; margin-top: 30px;">
    <a href="halaman2.html">
      <button style="background-color: #999;">⬅️ Kembali ke Halaman 2</button>
    </a>
  </div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <!-- 🔔 Suara notifikasi -->
  <audio id="notifSound" src="https://www.soundjay.com/buttons/sounds/button-16.mp3" preload="auto"></audio>

  <script>
    // Firebase config
    const firebaseConfig = {
      apiKey: "AIzaSyAR7Gck3aerU7XErxetQp3KgsMYFGqn5Zo",
      authDomain: "grup-obrolan-penanaman.firebaseapp.com",
      databaseURL: "https://grup-obrolan-penanaman-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "grup-obrolan-penanaman",
      storageBucket: "grup-obrolan-penanaman.appspot.com",
      messagingSenderId: "822090541791",
      appId: "1:822090541791:web:943a33b5ea1ecb97f1576a"
    };
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();
    const chatRef = database.ref("pesan");

    // Avatar dari daftar
    const avatarList = [
  "https://cdn-icons-png.flaticon.com/512/765/765449.png", // Anak kebun topi
  "https://cdn-icons-png.flaticon.com/512/2815/2815428.png", // Wajah lucu bibit
  "https://cdn-icons-png.flaticon.com/512/2809/2809641.png", // Bibit bertunas
  "https://cdn-icons-png.flaticon.com/512/2577/2577069.png", // Wajah daun
  "https://cdn-icons-png.flaticon.com/512/3069/3069174.png", // Petani
  "https://cdn-icons-png.flaticon.com/512/1709/1709786.png", // Karakter imut kebun
  "https://cdn-icons-png.flaticon.com/512/5907/5907361.png"  // Wajah buah lucu
];

    const daftarAvatar = document.getElementById("daftarAvatar");
    avatarList.forEach(url => {
      const img = document.createElement("img");
      img.src = url;
      img.onclick = () => {
        document.querySelectorAll("#daftarAvatar img").forEach(i => i.classList.remove("selected"));
        img.classList.add("selected");
        document.getElementById("fotoTerpilih").value = url;
        document.getElementById("previewFoto").src = url;
      };
      daftarAvatar.appendChild(img);
    });

    // Upload gambar
    document.getElementById("uploadFoto").addEventListener("change", function () {
      const file = this.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function (e) {
          document.getElementById("previewFoto").src = e.target.result;
          document.getElementById("fotoTerpilih").value = e.target.result;
          document.querySelectorAll("#daftarAvatar img").forEach(i => i.classList.remove("selected"));
        };
        reader.readAsDataURL(file);
      }
    });

    // Kirim pesan
    function kirimPesan() {
      const nama = document.getElementById("username").value.trim();
      const teks = document.getElementById("message").value.trim();
      const foto = document.getElementById("fotoTerpilih").value;
      const waktu = new Date().toLocaleTimeString("id-ID", { hour: '2-digit', minute: '2-digit' });

      if (nama && teks) {
        chatRef.push({ nama, teks, foto, waktu });
        document.getElementById("message").value = "";
      }
    }

    // Tampilkan pesan
    const chatLog = document.getElementById("chatLog");
    const notif = document.getElementById("notifSound");

    chatRef.on("child_added", (snap) => {
      const p = snap.val();

      if (chatLog.children[0] && chatLog.children[0].innerText.includes("Memuat")) {
        chatLog.innerHTML = "";
      }

      const el = document.createElement("div");
      el.className = "pesan";
      el.innerHTML = `
        <img src="${p.foto}" alt="User">
        <div class="isi-pesan">
          <strong>${p.nama}</strong><br>${p.teks}<br<!DOCTYPE html>

<body>
  <h1>💬 Grup Obrolan Publik</h1>

  <div id="chat-box">Memuat pesan...</div>

  <form id="chat-form">
    <input type="text" id="username" placeholder="Nama Anda" required />
    
    <select id="avatar" required>
      <option value="">Pilih Avatar</option>
      <option value="https://i.imgur.com/1XbCkH7.png">🌱 Tunas</option>
      <option value="https://i.imgur.com/4dMZK3g.png">🌻 Bunga</option>
      <option value="https://i.imgur.com/jM3Hn5p.png">🌾 Padi</option>
    </select>

    <input type="text" id="message" placeholder="Ketik pesan..." required />
    <button type="submit">Kirim</button>
  </form>

  <div class="nav-buttons">
    <a href="halaman2.html"><button>⬅️ Kembali ke Halaman 2</button></a>
    <a href="halaman4.html"><button>🎬 Lihat Video Pendek</button></a>
  </div>

  <!-- Firebase -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
    import { getDatabase, ref, push, onChildAdded } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAR7Gck3aerU7XErxetQp3KgsMYFGqn5Zo",
      authDomain: "grup-obrolan-penanaman.firebaseapp.com",
      databaseURL: "https://grup-obrolan-penanaman-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "grup-obrolan-penanaman",
      storageBucket: "grup-obrolan-penanaman.appspot.com",
      messagingSenderId: "822090541791",
      appId: "1:822090541791:web:943a33b5ea1ecb97f1576a"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const chatRef = ref(db, "group-chat");

    const form = document.getElementById("chat-form");
    const chatBox = document.getElementById("chat-box");
    const audio = new Audio("https://notificationsounds.com/notification-sounds/event-538/download/mp3");

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const username = document.getElementById("username").value;
      const message = document.getElementById("message").value;
      const avatar = document.getElementById("avatar").value;
      const time = new Date().toLocaleTimeString();

      push(chatRef, {
        username,
        message,
        avatar,
        time
      });

      form.reset();
    });

    onChildAdded(chatRef, (data) => {
      const { username, message, avatar, time } = data.val();
      const div = document.createElement("div");
      div.classList.add("message");
      div.innerHTML = `
        <img src="${avatar}" alt="avatar">
        <div>
          <strong>${username}</strong> <span class="time">(${time})</span><br>
          ${message}
        </div>
      `;
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
      audio.play();
    });

    window.onload = () => {
      chatBox.innerHTML = "";
    };
  </script>
</body>
</html>

      chatLog.appendChild(el);
      chatLog.scrollTop = chatLog.scrollHeight;
      notif.play();
    });
  </script>
</body>
</html>
