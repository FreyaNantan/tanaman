<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grup Obrolan Penanaman</title>
  <style>
    body {
      font-family: sans-serif;
      background-color: #e6f2ff;
      padding: 20px;
    }
    #chat-box {
      max-width: 600px;
      margin: auto;
      background: white;
      border-radius: 10px;
      padding: 20px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      height: 400px;
      overflow-y: scroll;
    }
    .chat-message {
      margin-bottom: 10px;
    }
    #input-form {
      display: flex;
      max-width: 600px;
      margin: 20px auto;
    }
    #input-name, #input-message {
      flex: 1;
      padding: 10px;
      margin-right: 10px;
    }
    #send-button {
      padding: 10px;
    }
  </style>
</head>
<body>
  <h2 align="center">🌿 Grup Obrolan Penanaman</h2>
  <div id="chat-box"></div>

  <form id="input-form">
    <input type="text" id="input-name" placeholder="Nama Anda" required>
    <input type="text" id="input-message" placeholder="Ketik pesan..." required>
    <button type="submit" id="send-button">Kirim</button>
  </form>

  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
    import { getDatabase, ref, push, onChildAdded } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAR7Gck3aerU7XErxetQp3KgsMYFGqn5Zo",
      authDomain: "grup-obrolan-penanaman.firebaseapp.com",
      databaseURL: "https://grup-obrolan-penanaman-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "grup-obrolan-penanaman",
      storageBucket: "grup-obrolan-penanaman.firebasestorage.app",
      messagingSenderId: "822090541791",
      appId: "1:822090541791:web:943a33b5ea1ecb97f1576a",
      measurementId: "G-160QLG8277"
    };

    // Inisialisasi Firebase
    const app = initializeApp(firebaseConfig);
    const database = getDatabase(app);
    const chatRef = ref(database, 'obrolan');

    // Kirim pesan
    const form = document.getElementById('input-form');
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const name = document.getElementById('input-name').value;
      const message = document.getElementById('input-message').value;
      if (name && message) {
        push(chatRef, {
          nama: name,
          pesan: message,
          waktu: new Date().toLocaleString()
        });
        form.reset();
      }
    });

    // Tampilkan pesan
    const chatBox = document.getElementById('chat-box');
    onChildAdded(chatRef, (data) => {
      const { nama, pesan, waktu } = data.val();
      const div = document.createElement('div');
      div.classList.add('chat-message');
      div.innerHTML = `<strong>${nama}</strong>: ${pesan} <br><small>${waktu}</small>`;
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
    });
  </script>
</body>
</html>
