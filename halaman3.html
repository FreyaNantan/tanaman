<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Grup Obrolan Penanaman</title>
  <style>
    body {
      background-color: #e0f0ff;
      font-family: Arial, sans-serif;
      padding: 20px;
      margin: 0;
    }

    header {
      background-color: #3399ff;
      color: white;
      padding: 20px;
      text-align: center;
      border-radius: 8px;
    }

    .chat-container {
      max-width: 700px;
      margin: 30px auto;
      background-color: #ffffff;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 0 12px rgba(0, 0, 0, 0.1);
    }

    .chat-log {
      height: 300px;
      overflow-y: auto;
      background: #f7f7f7;
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 20px;
    }

    .chat-log p {
      background: #e1f5fe;
      padding: 10px;
      border-radius: 8px;
      margin: 5px 0;
    }

    input, button {
      padding: 10px;
      margin: 5px 0;
      width: 100%;
      box-sizing: border-box;
      font-size: 16px;
      border-radius: 6px;
      border: 1px solid #ccc;
    }

    button {
      background-color: #66cc66;
      color: white;
      border: none;
      cursor: pointer;
    }

    @media (max-width: 600px) {
      .chat-log {
        height: 250px;
      }
    }
  </style>
</head>
<body>

  <header>
    <h1>💬 Grup Obrolan Penanaman</h1>
    <p>Diskusi dan tanya jawab seputar penanaman dan pupuk</p>
  </header>

  <div class="chat-container">
    <div class="chat-log" id="chatLog">
      <p><em>Memuat pesan...</em></p>
    </div>

    <input type="text" id="username" placeholder="Nama Anda" />
    <input type="text" id="message" placeholder="Tulis pesan..." />
    <button onclick="kirimPesan()">Kirim</button>
  </div>

  <!-- Tombol kembali ke halaman 2 -->
  <div style="text-align: center; margin-top: 30px;">
    <a href="halaman2.html">
      <button style="background-color: #999;">⬅️ Kembali ke Halaman 2</button>
    </a>
  </div>

  <!-- Firebase JS SDK (tanpa module) -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <script>
    // Konfigurasi Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyAR7Gck3aerU7XErxetQp3KgsMYFGqn5Zo",
      authDomain: "grup-obrolan-penanaman.firebaseapp.com",
      databaseURL: "https://grup-obrolan-penanaman-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "grup-obrolan-penanaman",
      storageBucket: "grup-obrolan-penanaman.appspot.com",
      messagingSenderId: "822090541791",
      appId: "1:822090541791:web:943a33b5ea1ecb97f1576a"
    };

    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();
    const chatRef = database.ref("pesan");

    function kirimPesan() {
      const nama = document.getElementById("username").value.trim();
      const teks = document.getElementById("message").value.trim();
      if (nama && teks) {
        chatRef.push({ nama: nama, teks: teks });
        document.getElementById("message").value = "";
      }
    }

    const chatLog = document.getElementById("chatLog");
    chatRef.on("child_added", (snapshot) => {
      const pesan = snapshot.val();
      const elemen = document.createElement("p");
      elemen.innerHTML = `<strong>${pesan.nama}:</strong> ${pesan.teks}`;
      chatLog.appendChild(elemen);
      chatLog.scrollTop = chatLog.scrollHeight;
    });
  </script>

</body>
</html>
