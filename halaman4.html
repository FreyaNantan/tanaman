<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Video Penanaman (Halaman 4)</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background-color: #e0f0ff;
      scroll-behavior: smooth;
      height: 100%;
      overflow: hidden;
    }

    h1 {
      text-align: center;
      color: #0077cc;
      padding: 20px;
    }

    .snap-container {
      height: 100vh;
      overflow-y: scroll;
      scroll-snap-type: y mandatory;
      -webkit-overflow-scrolling: touch;
    }

    .video-feed {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
    }

    .video-card {
      scroll-snap-align: start;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      position: relative;
      background: #3399ff;
    }

    .video-card video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #3399ff;
    }

    .view-count {
      position: absolute;
      top: 10px;
      left: 10px;
      color: white;
      background: rgba(0,0,0,0.4);
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 14px;
    }

    .btn-komentar, .btn-hapus {
      position: absolute;
      bottom: 20px;
      right: 20px;
      background: rgba(255,255,255,0.8);
      border: none;
      padding: 10px;
      border-radius: 50%;
      cursor: pointer;
    }

    .btn-scroll-upload, .btn-login-admin {
      position: fixed;
      top: 20px;
      z-index: 999;
      background: #3399ff;
      color: white;
      border: none;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      font-size: 20px;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
    }

    .btn-scroll-upload { right: 20px; }
    .btn-login-admin { left: 20px; }

    .overlay-upload, .overlay, .overlay-login {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .form-upload, .konten, .form-login {
      background: white;
      padding: 20px;
      border-radius: 12px;
      width: 90%;
      max-width: 400px;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
      text-align: center;
    }

    .form-upload input, .konten input, .form-login input {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border-radius: 8px;
      border: 1px solid #ccc;
    }

    .form-upload button, .konten button, .form-login button {
      padding: 10px;
      width: 100%;
      background: #3399ff;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    .close-btn {
      position: absolute;
      top: 10px;
      right: 20px;
      background: none;
      border: none;
      font-size: 20px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>📹 Video Penanaman <span id="adminTag"></span></h1>
  <button type="button" class="btn-scroll-upload" onclick="bukaUpload()">⏫</button>
  <button type="button" class="btn-login-admin" onclick="bukaLogin()">🔐</button>

  <div class="overlay-login" id="loginOverlay">
    <div class="form-login">
      <button class="close-btn" onclick="tutupLogin()">✖</button>
      <h2>Login Admin</h2>
      <input type="text" id="loginUser" placeholder="Username" />
      <input type="password" id="loginPass" placeholder="Password" />
      <button onclick="loginAdmin()">Masuk</button>
    </div>
  </div>

  <div class="overlay-upload" id="uploadOverlay">
    <div class="form-upload">
      <button class="close-btn" onclick="tutupUpload()">✖</button>
      <h2>Upload Video</h2>
      <input type="text" id="judulVideo" placeholder="Judul Video" required />
      <input type="file" id="videoFile" accept="video/*" required />
      <input type="password" id="kodeSandi" placeholder="Kode Sandi Penghapus (rahasia)" required />
      <button onclick="unggahVideo()">Unggah</button>
      <p id="statusUpload"></p>
    </div>
  </div>

  <div class="overlay" id="hapusOverlay">
    <div class="konten">
      <button class="close-btn" onclick="tutupHapus()">✖</button>
      <h2>Hapus Video Ini?</h2>
      <input type="password" id="kodeHapus" placeholder="Masukkan kode sandi...">
      <button onclick="konfirmasiHapus()">🗑️ Konfirmasi Hapus</button>
    </div>
  </div>

  <div class="snap-container">
    <div class="video-feed" id="videoFeed"></div>
  </div>

  <script>
    // Skrip JavaScript tetap sama seperti sebelumnya
  </script>
</body>
</html>
