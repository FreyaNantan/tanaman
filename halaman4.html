<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Video Penanaman (Halaman 4)</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #e0f0ff;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }

    h1 {
      text-align: center;
      color: #0077cc;
      padding: 20px;
    }

    .video-feed {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 60px;
      padding: 20px;
    }

    .video-card {
      position: relative;
      width: 100%;
      max-width: 420px;
      background-color: #fff;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    .video-card video {
      width: 100%;
      height: auto;
      object-fit: contain;
      display: block;
      background-color: #3399ff;
    }

    .view-count {
      position: absolute;
      top: 10px;
      left: 10px;
      color: white;
      background: rgba(0,0,0,0.4);
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 14px;
    }

    .btn-komentar {
      position: absolute;
      bottom: 20px;
      right: 20px;
      background: rgba(255,255,255,0.8);
      border: none;
      padding: 10px;
      border-radius: 50%;
      cursor: pointer;
    }

    .btn-scroll-upload {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 999;
      background: #3399ff;
      color: white;
      border: none;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      font-size: 20px;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
    }

    .overlay-upload, .overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .form-upload, .konten {
      background: white;
      padding: 20px;
      border-radius: 12px;
      width: 90%;
      max-width: 400px;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
      text-align: center;
    }

    .form-upload input, .konten input {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border-radius: 8px;
      border: 1px solid #ccc;
    }

    .form-upload button, .konten button {
      padding: 10px;
      width: 100%;
      background: #3399ff;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    .close-btn {
      position: absolute;
      top: 10px;
      right: 20px;
      background: none;
      border: none;
      font-size: 20px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>📹 Video Penanaman</h1>
  <button type="button" class="btn-scroll-upload" onclick="bukaUpload()">⏫</button>

  <div class="overlay-upload" id="uploadOverlay">
    <div class="form-upload">
      <button class="close-btn" onclick="tutupUpload()">✖</button>
      <h2>Upload Video</h2>
      <input type="text" id="judulVideo" placeholder="Judul Video" required />
      <input type="file" id="videoFile" accept="video/*" required />
      <input type="password" id="kodeSandi" placeholder="Kode Sandi Penghapus (rahasia)" required />
      <button onclick="unggahVideo()">Unggah</button>
      <p id="statusUpload"></p>
    </div>
  </div>

  <div class="overlay" id="hapusOverlay">
    <div class="konten">
      <button class="close-btn" onclick="tutupHapus()">✖</button>
      <h2>Hapus Video Ini?</h2>
      <input type="password" id="kodeHapus" placeholder="Masukkan kode sandi...">
      <button onclick="konfirmasiHapus()">🗑️ Konfirmasi Hapus</button>
    </div>
  </div>

  <div class="video-feed" id="videoFeed"></div>

  <script>
    const CLOUD_NAME = "dtl4uiytm";
    const UPLOAD_PRESET = "penanaman_preset";
    const BIN_ID = "687085726063391d31ab3bd3";
    const API_KEY = "$2a$10$gAEzlF7LNkB9ykiLrrl3bODG6YkiqyLkFOPe9kTm.ZD7Gt2KmdgbK";

    const uploadOverlay = document.getElementById("uploadOverlay");
    const statusUpload = document.getElementById("statusUpload");
    const videoFeed = document.getElementById("videoFeed");

    function bukaUpload() {
      uploadOverlay.style.display = "flex";
    }
    function tutupUpload() {
      uploadOverlay.style.display = "none";
      statusUpload.textContent = "";
    }

    async function unggahVideo() {
      const file = document.getElementById("videoFile").files[0];
      const judul = document.getElementById("judulVideo").value.trim();
      const sandi = document.getElementById("kodeSandi").value.trim();
      if (!file || !judul || !sandi) return alert("Semua kolom wajib diisi!");

      statusUpload.textContent = "⏳ Mengunggah video...";
      const formData = new FormData();
      formData.append("file", file);
      formData.append("upload_preset", UPLOAD_PRESET);
      formData.append("folder", "video-penanaman");

      const cloudRes = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/video/upload`, {
        method: "POST",
        body: formData
      });
      const cloudData = await cloudRes.json();

      const binRes = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
        headers: { "X-Master-Key": API_KEY }
      });
      const binData = await binRes.json();
      const videos = binData.record.videos || [];
      videos.unshift({ url: cloudData.secure_url, judul, views: 0, comments: [], sandi });

      await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
        method: "PUT",
        headers: {
          "Content-Type": "application/json",
          "X-Master-Key": API_KEY
        },
        body: JSON.stringify({ videos })
      });

      statusUpload.textContent = "✅ Video berhasil diunggah!";
      setTimeout(() => tutupUpload(), 1500);
      loadVideos();
    }

    let indexHapus = null;
    function bukaHapus(i) {
      indexHapus = i;
      document.getElementById("hapusOverlay").style.display = "flex";
    }
    function tutupHapus() {
      indexHapus = null;
      document.getElementById("hapusOverlay").style.display = "none";
      document.getElementById("kodeHapus").value = "";
    }
    async function konfirmasiHapus() {
      const kode = document.getElementById("kodeHapus").value.trim();
      const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
        headers: { "X-Master-Key": API_KEY }
      });
      const data = await res.json();
      const videos = data.record.videos;

      if (videos[indexHapus].sandi !== kode) {
        alert("❌ Kode sandi salah!");
        return;
      }

      videos.splice(indexHapus, 1);
      await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
        method: "PUT",
        headers: {
          "Content-Type": "application/json",
          "X-Master-Key": API_KEY
        },
        body: JSON.stringify({ videos })
      });

      tutupHapus();
      loadVideos();
    }

    async function loadVideos() {
      const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
        headers: { "X-Master-Key": API_KEY }
      });
      const data = await res.json();
      const videos = data.record.videos || [];

      videoFeed.innerHTML = "";
      videos.forEach((v, i) => {
        const div = document.createElement("div");
        div.className = "video-card";
        div.innerHTML = `
          <video id="video-${i}" src="${v.url}" controls playsinline></video>
          <div class="view-count">👁️ ${v.views} views</div>
          <button class="btn-komentar" onclick="bukaHapus(${i})">🗑️</button>
        `;
        videoFeed.appendChild(div);

        const videoElement = div.querySelector("video");
        const watchedKey = `viewed_${v.url}`;

        videoElement.addEventListener("play", async () => {
          if (!localStorage.getItem(watchedKey)) {
            localStorage.setItem(watchedKey, "1");
            const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
              headers: { "X-Master-Key": API_KEY }
            });
            const data = await res.json();
            const videos = data.record.videos;
            videos[i].views++;
            await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
              method: "PUT",
              headers: {
                "Content-Type": "application/json",
                "X-Master-Key": API_KEY
              },
              body: JSON.stringify({ videos })
            });
            document.querySelector(`.view-count`).textContent = `👁️ ${videos[i].views} views`;
          }
        });
      });
    }

    loadVideos();
  </script>
</body>
</html>
