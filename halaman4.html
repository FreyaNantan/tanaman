<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Video Pendek Fullscreen</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: sans-serif;
      overflow: hidden;
    }

    .video-feed {
      height: 100vh;
      overflow-y: scroll;
      scroll-snap-type: y mandatory;
    }

    .video-card {
      scroll-snap-align: start;
      height: 100vh;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: black;
    }

    video {
      max-height: 100%;
      max-width: 100%;
    }

    .judul {
      position: absolute;
      top: 20px;
      left: 20px;
      color: white;
      font-size: 18px;
      background: rgba(0,0,0,0.5);
      padding: 5px 10px;
      border-radius: 6px;
    }

    .btn-komentar {
      position: absolute;
      bottom: 20px;
      right: 20px;
      background: rgba(255,255,255,0.7);
      border: none;
      padding: 10px;
      border-radius: 50%;
      font-size: 18px;
      cursor: pointer;
    }

    /* Overlay Komentar */
    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: white;
      z-index: 999;
      display: none;
      flex-direction: column;
      padding: 20px;
    }

    .overlay h2 {
      margin-top: 0;
    }

    .overlay .close-btn {
      position: absolute;
      top: 10px;
      right: 15px;
      background: red;
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
    }

    .overlay input {
      padding: 10px;
      width: 100%;
      margin-bottom: 10px;
    }

    .komentar-list {
      margin-top: 10px;
      max-height: 200px;
      overflow-y: auto;
    }
  </style>
</head>
<body>

<div class="video-feed" id="videoFeed">Loading...</div>

<!-- Overlay Komentar -->
<div class="overlay" id="komentarOverlay">
  <button class="close-btn" onclick="tutupKomentar()">Tutup ✖</button>
  <h2>Komentar</h2>
  <input type="text" id="namaKomentar" placeholder="Nama Anda">
  <input type="text" id="pesanKomentar" placeholder="Tulis komentar...">
  <button onclick="kirimKomentar()">💬 Kirim</button>
  <div class="komentar-list" id="listKomentar"></div>
</div>

<script>
  const BIN_ID = "687085726063391d31ab3bd3";
  const API_KEY = "$2a$10$gAEzlF7LNkB9ykiLrrl3bODG6YkiqyLkFOPe9kTm.ZD7Gt2KmdgbK";
  let videoData = [];
  let indexKomentarAktif = null;

  async function loadVideos() {
    const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
      headers: { "X-Master-Key": API_KEY }
    });
    const data = await res.json();
    videoData = data.record.videos || [];

    const feed = document.getElementById("videoFeed");
    feed.innerHTML = "";

    videoData.forEach((v, i) => {
      const card = document.createElement("div");
      card.className = "video-card";
      card.innerHTML = `
        <div class="judul">${v.judul || "Tanpa Judul"}</div>
        <video src="${v.url}" controls></video>
        <button class="btn-komentar" onclick="bukaKomentar(${i})">💬</button>
      `;
      feed.appendChild(card);
    });
  }

  function bukaKomentar(index) {
    indexKomentarAktif = index;
    const overlay = document.getElementById("komentarOverlay");
    const list = document.getElementById("listKomentar");
    const data = videoData[index].comments || [];

    list.innerHTML = data.map(k => `💬 <b>${k.nama}</b>: ${k.pesan}`).join("<br>");
    overlay.style.display = "flex";
  }

  function tutupKomentar() {
    document.getElementById("komentarOverlay").style.display = "none";
    document.getElementById("namaKomentar").value = "";
    document.getElementById("pesanKomentar").value = "";
  }

  async function kirimKomentar() {
    const nama = document.getElementById("namaKomentar").value.trim();
    const pesan = document.getElementById("pesanKomentar").value.trim();
    if (!nama || !pesan) return alert("Lengkapi nama dan komentar.");

    const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
      headers: { "X-Master-Key": API_KEY }
    });
    const data = await res.json();
    const videos = data.record.videos;

    videos[indexKomentarAktif].comments = videos[indexKomentarAktif].comments || [];
    videos[indexKomentarAktif].comments.push({ nama, pesan });

    await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
      method: "PUT",
      headers: {
        "Content-Type": "application/json",
        "X-Master-Key": API_KEY
      },
      body: JSON.stringify({ videos })
    });

    tutupKomentar();
    loadVideos();
  }

  loadVideos();
</script>

</body>
</html>
