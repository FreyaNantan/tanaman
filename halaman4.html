<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Video Penanaman (Halaman 4)</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #e0f0ff;
      margin: 0;
      padding: 0;
    }

    header {
      background: #0077cc;
      color: white;
      padding: 15px;
      text-align: center;
      position: relative;
    }

    .icon-btn {
      position: absolute;
      top: 15px;
      font-size: 20px;
      background: white;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #uploadIcon {
      right: 15px;
    }

    #adminIcon {
      left: 15px;
    }

    .video-feed {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px;
    }

    .video-card {
      background: white;
      border-radius: 12px;
      padding: 15px;
      margin: 30px 0;
      width: 90%;
      max-width: 500px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      position: relative;
    }

    video {
      width: 100%;
      border-radius: 8px;
    }

    .view-count {
      font-size: 14px;
      color: #555;
      margin-top: 5px;
    }

    .comment-icon {
      position: absolute;
      top: 50%;
      right: 15px;
      transform: translateY(-50%);
      font-size: 28px;
      background: #ffffffcc;
      padding: 8px;
      border-radius: 50%;
      cursor: pointer;
      z-index: 1;
    }

    .comment-popup, .admin-popup {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.8);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .comment-popup-content, .admin-popup-content {
      background: white;
      padding: 20px;
      border-radius: 12px;
      width: 90%;
      max-width: 400px;
      max-height: 80%;
      overflow-y: auto;
    }

    .comment-popup-content input, .admin-popup-content input {
      width: 100%;
      margin: 5px 0;
      padding: 6px;
    }

    .delete-btn {
      position: absolute;
      bottom: 10px;
      left: 10px;
      background: #ff4444;
      color: white;
      border: none;
      padding: 5px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      display: none;
    }

    .show-delete .delete-btn {
      display: block;
    }
  </style>
</head>
<body>
  <header>
    <button id="adminIcon" class="icon-btn">🔐</button>
    <h1>📹 Video Penanaman Pendek</h1>
    <button id="uploadIcon" class="icon-btn">⏫</button>
  </header>

  <div class="video-feed" id="videoFeed">
    <p>Memuat video...</p>
  </div>

  <!-- Popup Komentar -->
  <div class="comment-popup" id="commentPopup">
    <div class="comment-popup-content">
      <h3>Komentar</h3>
      <div id="commentList"></div>
      <input id="namaKomentar" placeholder="Nama Anda" />
      <input id="isiKomentar" placeholder="Komentar Anda" />
      <button onclick="kirimKomentarTerbuka()">Kirim</button>
      <button onclick="tutupKomentar()">Tutup</button>
    </div>
  </div>

  <!-- Popup Admin Login -->
  <div class="admin-popup" id="adminPopup">
    <div class="admin-popup-content">
      <h3>Masuk Admin</h3>
      <input type="password" id="adminPassword" placeholder="Masukkan Password Admin" />
      <button onclick="verifikasiAdmin()">Masuk</button>
      <button onclick="tutupAdminPopup()">Batal</button>
    </div>
  </div>

  <script>
    let komentarIndex = null;
    let videosGlobal = [];
    let isAdmin = false;

    document.getElementById("adminIcon").onclick = function() {
      document.getElementById("adminPopup").style.display = "flex";
    };

    function tutupAdminPopup() {
      document.getElementById("adminPopup").style.display = "none";
    }

    function verifikasiAdmin() {
      const input = document.getElementById("adminPassword").value;
      if (input === "admin54321") {
        isAdmin = true;
        alert("Berhasil masuk sebagai admin.");
        document.getElementById("adminPopup").style.display = "none";
        loadVideos();
      } else {
        alert("Password salah!");
      }
    }

    function bukaKomentar(i) {
      komentarIndex = i;
      const komentarList = videosGlobal[i].comments || [];
      document.getElementById("commentList").innerHTML = komentarList.map(k => `💬 <strong>${k.nama}</strong>: ${k.pesan}`).join("<br>");
      document.getElementById("commentPopup").style.display = "flex";
    }

    function tutupKomentar() {
      document.getElementById("commentPopup").style.display = "none";
    }

    async function kirimKomentarTerbuka() {
      const nama = document.getElementById("namaKomentar").value.trim();
      const pesan = document.getElementById("isiKomentar").value.trim();
      if (!nama || !pesan) return;

      const res = await fetch(`https://api.jsonbin.io/v3/b/687085726063391d31ab3bd3/latest`, {
        headers: { "X-Master-Key": "$2a$10$gAEzlF7LNkB9ykiLrrl3bODG6YkiqyLkFOPe9kTm.ZD7Gt2KmdgbK" }
      });
      const data = await res.json();
      const videos = data.record.videos;
      videos[komentarIndex].comments.push({ nama, pesan });

      await fetch(`https://api.jsonbin.io/v3/b/687085726063391d31ab3bd3`, {
        method: "PUT",
        headers: {
          "Content-Type": "application/json",
          "X-Master-Key": "$2a$10$gAEzlF7LNkB9ykiLrrl3bODG6YkiqyLkFOPe9kTm.ZD7Gt2KmdgbK"
        },
        body: JSON.stringify({ videos })
      });

      tutupKomentar();
      loadVideos();
    }

    async function hapusVideo(index) {
      if (!confirm("Yakin ingin menghapus video ini?")) return;
      const res = await fetch(`https://api.jsonbin.io/v3/b/687085726063391d31ab3bd3/latest`, {
        headers: { "X-Master-Key": "$2a$10$gAEzlF7LNkB9ykiLrrl3bODG6YkiqyLkFOPe9kTm.ZD7Gt2KmdgbK" }
      });
      const data = await res.json();
      const videos = data.record.videos;
      videos.splice(index, 1);

      await fetch(`https://api.jsonbin.io/v3/b/687085726063391d31ab3bd3`, {
        method: "PUT",
        headers: {
          "Content-Type": "application/json",
          "X-Master-Key": "$2a$10$gAEzlF7LNkB9ykiLrrl3bODG6YkiqyLkFOPe9kTm.ZD7Gt2KmdgbK"
        },
        body: JSON.stringify({ videos })
      });

      loadVideos();
    }

    async function loadVideos() {
      const feed = document.getElementById("videoFeed");
      feed.innerHTML = "<p>Memuat video...</p>";

      const res = await fetch(`https://api.jsonbin.io/v3/b/687085726063391d31ab3bd3/latest`, {
        headers: { "X-Master-Key": "$2a$10$gAEzlF7LNkB9ykiLrrl3bODG6YkiqyLkFOPe9kTm.ZD7Gt2KmdgbK" }
      });
      const data = await res.json();
      videosGlobal = data.record.videos;

      feed.innerHTML = "";

      videosGlobal.forEach((v, i) => {
        const card = document.createElement("div");
        card.className = "video-card" + (isAdmin ? " show-delete" : "");

        card.innerHTML = `
          <video controls src="${v.url}"></video>
          <div class="view-count">👁️ ${v.views || 0} views</div>
          <div class="comment-icon" onclick="bukaKomentar(${i})">💬</div>
          ${isAdmin ? `<button class="delete-btn" onclick="hapusVideo(${i})">🗑️</button>` : ""}
        `;

        feed.appendChild(card);
      });
    }

    loadVideos();
  </script>
</body>
</html>
