<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Video Pendek Penanaman</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      margin: 0;
      padding: 10px;
    }

    header {
      background-color: #3399ff;
      color: white;
      padding: 20px;
      text-align: center;
    }

    .upload-section, .video-feed {
      max-width: 500px;
      margin: 20px auto;
      background: white;
      padding: 20px;
      border-radius: 8px;
    }

    video {
      width: 100%;
      border-radius: 10px;
      margin-bottom: 10px;
    }

    input[type="file"], input[type="text"], button {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      font-size: 16px;
    }
  </style>
</head>
<body>

<header>
  <h1>🌱 Video Pendek Penanaman</h1>
</header>

<div class="upload-section">
  <h3>Upload Video Baru</h3>
  <input type="file" id="videoInput" accept="video/*">
  <input type="text" id="caption" placeholder="Tulis caption...">
  <button onclick="uploadVideo()">Unggah</button>
</div>

<div class="video-feed" id="videoFeed">
  <h3>Feed Video</h3>
</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<!-- Firebase Config -->
<script>
  const firebaseConfig = {
    apiKey: "AIzaSyAR7Gck3aerU7XErxetQp3KgsMYFGqn5Zo",
    authDomain: "grup-obrolan-penanaman.firebaseapp.com",
    databaseURL: "https://grup-obrolan-penanaman-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "grup-obrolan-penanaman",
    storageBucket: "grup-obrolan-penanaman.appspot.com",
    messagingSenderId: "822090541791",
    appId: "1:822090541791:web:943a33b5ea1ecb97f1576a"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();
  const videoRef = db.ref("video");
</script>

<!-- Upload ke Cloudinary -->
<script>
  function uploadVideo() {
    const file = document.getElementById("videoInput").files[0];
    const caption = document.getElementById("caption").value;

    if (!file) return alert("Pilih video dulu");
    if (!caption.trim()) return alert("Tulis caption");

    const formData = new FormData();
    formData.append("file", file);
    formData.append("upload_preset", "UPLOAD_PRESET_KAMU"); // Ganti di sini

    fetch("https://api.cloudinary.com/v1_1/dtl4uiytm/video/upload", {
      method: "POST",
      body: formData
    })
    .then(res => res.json())
    .then(data => {
      const videoUrl = data.secure_url;
      const time = new Date().toLocaleString("id-ID");

      videoRef.push({ videoUrl, caption, time, views: 0 });
      document.getElementById("caption").value = "";
      alert("✅ Video berhasil diunggah!");
    })
    .catch(err => alert("Gagal upload ke Cloudinary: " + err));
  }

  // Tampilkan feed video
  videoRef.on("child_added", snap => {
    const vid = snap.val();
    const el = document.createElement("div");
    el.innerHTML = `
      <video controls src="${vid.videoUrl}"></video>
      <p>${vid.caption}</p>
      <small>👁️ ${vid.views || 0} views • 🕒 ${vid.time}</small>
      <hr>
    `;
    document.getElementById("videoFeed").prepend(el);

    // Tambah 1 view saat video muncul
    snap.ref.update({ views: (vid.views || 0) + 1 });
  });
</script>

</body>
</html>
