<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Video Penanaman</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      font-family: sans-serif;
      background: black;
      overflow-x: hidden;
    }

    .form-upload {
      background: white;
      padding: 20px;
      border-radius: 12px;
      margin: 15px;
      max-width: 600px;
      margin: 20px auto;
    }

    .form-upload h2 {
      margin-top: 0;
    }

    .form-upload input {
      display: block;
      margin-bottom: 10px;
      padding: 10px;
      width: 100%;
      font-size: 16px;
    }

    .form-upload button {
      padding: 10px 15px;
      font-size: 16px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    .btn-scroll-upload {
      position: fixed;
      top: 20px;
      right: 20px;
      background: rgba(0,123,255,0.9);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 50%;
      font-size: 18px;
      cursor: pointer;
      z-index: 999;
      box-shadow: 0 0 8px rgba(0,0,0,0.3);
    }

    .video-feed {
      scroll-snap-type: y mandatory;
      height: 100vh;
      overflow-y: scroll;
    }

    .video-card {
      scroll-snap-align: start;
      height: 100vh;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      background: black;
    }

    video {
      max-height: 100%;
      max-width: 100%;
    }

    .judul {
      position: absolute;
      top: 20px;
      left: 20px;
      color: white;
      font-size: 18px;
      background: rgba(0,0,0,0.5);
      padding: 6px 10px;
      border-radius: 8px;
    }

    .btn-komentar {
      position: absolute;
      top: 50%;
      right: 20px;
      transform: translateY(-50%);
      background: rgba(255,255,255,0.8);
      border: none;
      padding: 12px;
      border-radius: 50%;
      font-size: 18px;
      cursor: pointer;
      z-index: 5;
    }

    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: white;
      z-index: 1000;
      display: none;
      flex-direction: column;
      padding: 20px;
    }

    .overlay .close-btn {
      position: absolute;
      top: 10px;
      right: 15px;
      background: red;
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
    }

    .overlay input {
      padding: 10px;
      width: 100%;
      margin-bottom: 10px;
      font-size: 16px;
    }

    .komentar-list {
      margin-top: 10px;
      max-height: 250px;
      overflow-y: auto;
      border-top: 1px solid #ccc;
      padding-top: 10px;
      font-size: 16px;
    }

    .komentar-item {
      margin-bottom: 6px;
    }
  </style>
</head>
<body>

<!-- Tombol upload yang scroll ke form -->
<button class="btn-scroll-upload" onclick="scrollKeUpload()">⏫</button>

<!-- Form Upload -->
<div id="uploadSection" class="form-upload">
  <h2>Upload Video Penanaman</h2>
  <input type="text" id="judulVideo" placeholder="Judul Video" required />
  <input type="file" id="videoFile" accept="video/*" required />
  <button onclick="unggahVideo()">Unggah</button>
  <p id="statusUpload"></p>
</div>

<!-- Feed Video -->
<div class="video-feed" id="videoFeed">Memuat video...</div>

<!-- Overlay Komentar -->
<div class="overlay" id="komentarOverlay">
  <button class="close-btn" onclick="tutupKomentar()">✖ Tutup</button>
  <h2>Komentar</h2>
  <input type="text" id="namaKomentar" placeholder="Nama Anda">
  <input type="text" id="pesanKomentar" placeholder="Tulis komentar...">
  <button onclick="kirimKomentar()">💬 Kirim</button>
  <div class="komentar-list" id="listKomentar"></div>
</div>

<script>
  const BIN_ID = "687085726063391d31ab3bd3";
  const API_KEY = "$2a$10$gAEzlF7LNkB9ykiLrrl3bODG6YkiqyLkFOPe9kTm.ZD7Gt2KmdgbK";
  let videoData = [];
  let indexKomentarAktif = null;

  function scrollKeUpload() {
    document.getElementById("uploadSection").scrollIntoView({ behavior: "smooth" });
  }

  async function loadVideos() {
    const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
      headers: { "X-Master-Key": API_KEY }
    });
    const data = await res.json();
    videoData = data.record.videos || [];

    const feed = document.getElementById("videoFeed");
    feed.innerHTML = "";

    videoData.forEach((v, i) => {
      const card = document.createElement("div");
      card.className = "video-card";
      card.innerHTML = `
        <div class="judul">${v.judul || "Tanpa Judul"}</div>
        <video src="${v.url}" controls></video>
        <button class="btn-komentar" onclick="bukaKomentar(${i})">💬</button>
      `;
      feed.appendChild(card);
    });
  }

  function bukaKomentar(index) {
    indexKomentarAktif = index;
    const overlay = document.getElementById("komentarOverlay");
    const list = document.getElementById("listKomentar");
    const data = videoData[index].comments || [];
    list.innerHTML = data.map(k => `<div class="komentar-item">💬 <b>${k.nama}</b>: ${k.pesan}</div>`).join("");
    overlay.style.display = "flex";
  }

  function tutupKomentar() {
    document.getElementById("komentarOverlay").style.display = "none";
    document.getElementById("namaKomentar").value = "";
    document.getElementById("pesanKomentar").value = "";
  }

  async function kirimKomentar() {
    const nama = document.getElementById("namaKomentar").value.trim();
    const pesan = document.getElementById("pesanKomentar").value.trim();
    if (!nama || !pesan) return alert("Isi nama dan komentar!");

    const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
      headers: { "X-Master-Key": API_KEY }
    });
    const data = await res.json();
    const videos = data.record.videos;

    videos[indexKomentarAktif].comments = videos[indexKomentarAktif].comments || [];
    videos[indexKomentarAktif].comments.push({ nama, pesan });

    await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
      method: "PUT",
      headers: {
        "Content-Type": "application/json",
        "X-Master-Key": API_KEY
      },
      body: JSON.stringify({ videos })
    });

    const list = document.getElementById("listKomentar");
    list.innerHTML += `<div class="komentar-item">💬 <b>${nama}</b>: ${pesan}</div>`;
    document.getElementById("pesanKomentar").value = "";
  }

  async function unggahVideo() {
    const judul = document.getElementById("judulVideo").value.trim();
    const file = document.getElementById("videoFile").files[0];
    const status = document.getElementById("statusUpload");
    if (!judul || !file) return alert("Isi judul dan pilih video!");

    status.textContent = "⏳ Mengunggah...";

    const formData = new FormData();
    formData.append("file", file);
    formData.append("upload_preset", "penanaman_preset");
    formData.append("folder", "video-penanaman");

    try {
      const resCloud = await fetch("https://api.cloudinary.com/v1_1/dtl4uiytm/video/upload", {
        method: "POST",
        body: formData
      });
      const cloudData = await resCloud.json();

      const resBin = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
        headers: { "X-Master-Key": API_KEY }
      });
      const binData = await resBin.json();
      const videos = binData.record.videos || [];

      videos.unshift({
        url: cloudData.secure_url,
        judul,
        views: 0,
        comments: []
      });

      await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
        method: "PUT",
        headers: {
          "Content-Type": "application/json",
          "X-Master-Key": API_KEY
        },
        body: JSON.stringify({ videos })
      });

      status.textContent = "✅ Berhasil diunggah!";
      document.getElementById("judulVideo").value = "";
      document.getElementById("videoFile").value = "";
      loadVideos();
    } catch (err) {
      console.error(err);
      status.textContent = "❌ Gagal mengunggah.";
    }
  }

  loadVideos();
</script>

</body>
</html>
