<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Video Penanaman</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background-color: #3399ff;
      scroll-behavior: smooth;
      height: 100%;
      overflow: hidden;
    }

    .snap-container {
      height: 100vh;
      overflow-y: scroll;
      scroll-snap-type: y mandatory;
      -webkit-overflow-scrolling: touch;
    }

    .video-feed {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .video-card {
      scroll-snap-align: start;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      position: relative;
      background: #3399ff;
    }

    .video-card video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #3399ff;
    }

    .view-count {
      position: absolute;
      top: 10px;
      left: 10px;
      color: white;
      background: rgba(0,0,0,0.4);
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 14px;
    }

    .btn-scroll-upload {
      position: fixed;
      top: 20px;
      right: 20px;
      background: #fff;
      color: #3399ff;
      border: none;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      font-size: 24px;
      z-index: 1000;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
    }

    .overlay-upload {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .form-upload {
      background: white;
      padding: 20px;
      border-radius: 12px;
      width: 90%;
      max-width: 400px;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
      text-align: center;
    }

    .form-upload input {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border-radius: 8px;
      border: 1px solid #ccc;
    }

    .form-upload button {
      padding: 10px;
      width: 100%;
      background: #3399ff;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    .close-btn {
      position: absolute;
      top: 10px;
      right: 20px;
      background: none;
      border: none;
      font-size: 20px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <button class="btn-scroll-upload" onclick="bukaUpload()">⏫</button>

  <div class="overlay-upload" id="uploadOverlay">
    <div class="form-upload">
      <button class="close-btn" onclick="tutupUpload()">✖</button>
      <h2>Upload Video</h2>
      <input type="text" id="judulVideo" placeholder="Judul Video" required />
      <input type="file" id="videoFile" accept="video/*" required />
      <button onclick="unggahVideo()">Unggah</button>
      <p id="statusUpload"></p>
    </div>
  </div>

  <div class="snap-container">
    <div class="video-feed" id="videoFeed"></div>
  </div>

  <script>
    const CLOUD_NAME = "dtl4uiytm";
    const UPLOAD_PRESET = "penanaman_preset";
    const BIN_ID = "687085726063391d31ab3bd3";
    const API_KEY = "$2a$10$gAEzlF7LNkB9ykiLrrl3bODG6YkiqyLkFOPe9kTm.ZD7Gt2KmdgbK";

    const videoFeed = document.getElementById("videoFeed");
    const uploadOverlay = document.getElementById("uploadOverlay");
    const statusUpload = document.getElementById("statusUpload");

    function bukaUpload() {
      uploadOverlay.style.display = "flex";
    }

    function tutupUpload() {
      uploadOverlay.style.display = "none";
      document.getElementById("videoFile").value = "";
      document.getElementById("judulVideo").value = "";
      statusUpload.textContent = "";
    }

    async function unggahVideo() {
      const file = document.getElementById("videoFile").files[0];
      const title = document.getElementById("judulVideo").value.trim();
      if (!file || !title) return alert("Judul dan file video wajib diisi.");

      statusUpload.textContent = "⏳ Mengunggah video...";
      const formData = new FormData();
      formData.append("file", file);
      formData.append("upload_preset", UPLOAD_PRESET);
      formData.append("folder", "video-penanaman");

      try {
        const uploadRes = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/video/upload`, {
          method: "POST",
          body: formData,
        });
        const uploadData = await uploadRes.json();

        const videoBaru = {
          url: uploadData.secure_url,
          title: title,
          views: 0,
          comments: []
        };

        const getRes = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
          headers: { "X-Master-Key": API_KEY }
        });
        const data = await getRes.json();
        const videos = data.record.videos || [];

        videos.unshift(videoBaru);

        await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
          method: "PUT",
          headers: {
            "Content-Type": "application/json",
            "X-Master-Key": API_KEY
          },
          body: JSON.stringify({ videos })
        });

        statusUpload.textContent = "✅ Berhasil diunggah!";
        setTimeout(() => {
          tutupUpload();
          loadVideos();
        }, 1000);
      } catch (err) {
        console.error(err);
        statusUpload.textContent = "❌ Gagal mengunggah.";
      }
    }

    async function loadVideos() {
      try {
        const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
          headers: { "X-Master-Key": API_KEY }
        });
        const data = await res.json();
        const videos = data.record.videos || [];

        videoFeed.innerHTML = "";
        videos.forEach((video, index) => {
          const card = document.createElement("div");
          card.className = "video-card";

          card.innerHTML = `
            <video id="vid-${index}" src="${video.url}" playsinline controls></video>
            <div class="view-count" id="view-${index}">👁️ ${video.views || 0} views</div>
          `;

          videoFeed.appendChild(card);

          const vid = document.getElementById(`vid-${index}`);
          vid.addEventListener("play", () => tambahView(index));
        });
      } catch (err) {
        videoFeed.innerHTML = "<p style='color:white'>Gagal memuat video.</p>";
        console.error(err);
      }
    }

    async function tambahView(index) {
      const key = "viewed_" + index;
      if (localStorage.getItem(key)) return;

      const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
        headers: { "X-Master-Key": API_KEY }
      });
      const data = await res.json();
      const videos = data.record.videos;

      videos[index].views = (videos[index].views || 0) + 1;
      localStorage.setItem(key, "1");

      await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
        method: "PUT",
        headers: {
          "Content-Type": "application/json",
          "X-Master-Key": API_KEY
        },
        body: JSON.stringify({ videos })
      });

      document.getElementById(`view-${index}`).innerText = `👁️ ${videos[index].views} views`;
    }

    loadVideos();
  </script>
</body>
</html>
