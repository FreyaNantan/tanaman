<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Video Penanaman (Halaman 4)</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #e0f0ff;
      margin: 0;
      padding: 20px;
    }

    h1 {
      text-align: center;
      color: #0077cc;
    }

    .video-feed {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .video-card {
      background: white;
      border-radius: 12px;
      padding: 15px;
      margin: 15px 0;
      width: 90%;
      max-width: 500px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    .video-card video {
      width: 100%;
      border-radius: 8px;
    }

    .comment-box {
      margin-top: 10px;
    }

    .comment-box input {
      width: 100%;
      padding: 8px;
      border-radius: 6px;
      border: 1px solid #ccc;
      margin-top: 5px;
    }

    .view-count {
      font-size: 14px;
      color: #666;
    }

    #uploadForm {
      margin: 30px auto;
      max-width: 500px;
      background: #fff;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 0 10px rgba(0,0,0,0.08);
    }

    #uploadForm input[type="file"],
    #uploadForm input[type="text"],
    #uploadForm button {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      font-size: 16px;
    }

    #statusUpload {
      text-align: center;
      color: green;
    }

    .btn-kembali {
      display: block;
      margin: 20px auto;
      background-color: #999;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      text-decoration: none;
      text-align: center;
    }
  </style>
</head>
<body>

  <h1>📹 Video Penanaman Pendek</h1>

  <form id="uploadForm">
    <input type="text" id="judulVideo" placeholder="Judul Video" required />
    <input type="file" id="videoInput" accept="video/*" required />
    <button type="submit">⬆️ Unggah Video</button>
    <p id="statusUpload"></p>
  </form>

  <div class="video-feed" id="videoFeed">
    <p>Memuat video...</p>
  </div>

  <a href="halaman3.html" class="btn-kembali">⬅️ Kembali ke Halaman 3</a>

  <script>
    const CLOUD_NAME = "dtl4uiytm";
    const UPLOAD_PRESET = "penanaman_preset";
    const BIN_ID = "687085726063391d31ab3bd3";
    const API_KEY = "$2a$10$gAEzlF7LNkB9ykiLrrl3bODG6YkiqyLkFOPe9kTm.ZD7Gt2KmdgbK";
    const videoFeed = document.getElementById("videoFeed");
    const statusUpload = document.getElementById("statusUpload");

    // Upload Video
    document.getElementById("uploadForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const file = document.getElementById("videoInput").files[0];
      const judul = document.getElementById("judulVideo").value.trim();
      if (!file || !judul) return;

      statusUpload.textContent = "⏳ Mengunggah video...";

      const formData = new FormData();
      formData.append("file", file);
      formData.append("upload_preset", UPLOAD_PRESET);
      formData.append("folder", "video-penanaman");

      try {
        const cloudRes = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/video/upload`, {
          method: "POST",
          body: formData
        });

        const cloudData = await cloudRes.json();

        const newVideo = {
          judul: judul,
          url: cloudData.secure_url,
          views: 0,
          comments: []
        };

        const binRes = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
          headers: { "X-Master-Key": API_KEY }
        });
        const binData = await binRes.json();
        const videos = binData.record.videos || [];
        videos.unshift(newVideo);

        await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
          method: "PUT",
          headers: {
            "Content-Type": "application/json",
            "X-Master-Key": API_KEY
          },
          body: JSON.stringify({ videos })
        });

        statusUpload.textContent = "✅ Video berhasil diunggah!";
        document.getElementById("videoInput").value = "";
        document.getElementById("judulVideo").value = "";
        loadVideos();
      } catch (err) {
        statusUpload.textContent = "❌ Gagal mengunggah video.";
        console.error(err);
      }
    });

    // Tampilkan video
    async function loadVideos() {
      try {
        const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
          headers: { "X-Master-Key": API_KEY }
        });
        const data = await res.json();
        const videos = data.record.videos || [];

        videoFeed.innerHTML = "";

        videos.forEach((v, i) => {
          const card = document.createElement("div");
          card.className = "video-card";

          const komentarHTML = v.comments?.map(c => `<div>💬 <strong>${c.nama}</strong>: ${c.pesan}</div>`).join("") || "";

          card.innerHTML = `
            <h3>${v.judul || "Video tanpa judul"}</h3>
            <video controls src="${v.url}"></video>
            <div class="view-count">👁️ ${v.views || 0} views</div>
            <div class="comment-box">
              <input placeholder="Nama" id="nama-${i}" />
              <input placeholder="Komentar" id="komentar-${i}" />
              <button onclick="kirimKomentar(${i})">💬 Kirim</button>
              <div id="komentarList-${i}">${komentarHTML}</div>
            </div>
          `;

          videoFeed.appendChild(card);
          tambahView(i);
        });
      } catch (err) {
        videoFeed.innerHTML = "<p>❌ Gagal memuat video.</p>";
      }
    }

    // Tambah View
    async function tambahView(index) {
      const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
        headers: { "X-Master-Key": API_KEY }
      });
      const data = await res.json();
      const videos = data.record.videos;
      videos[index].views = (videos[index].views || 0) + 1;

      await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
        method: "PUT",
        headers: {
          "Content-Type": "application/json",
          "X-Master-Key": API_KEY
        },
        body: JSON.stringify({ videos })
      });
    }

    // Kirim komentar
    async function kirimKomentar(index) {
      const nama = document.getElementById(`nama-${index}`).value.trim();
      const pesan = document.getElementById(`komentar-${index}`).value.trim();
      if (!nama || !pesan) return;

      const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
        headers: { "X-Master-Key": API_KEY }
      });
      const data = await res.json();
      const videos = data.record.videos;

      videos[index].comments = videos[index].comments || [];
      videos[index].comments.push({ nama, pesan });

      await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
        method: "PUT",
        headers: {
          "Content-Type": "application/json",
          "X-Master-Key": API_KEY
        },
        body: JSON.stringify({ videos })
      });

      loadVideos();
    }

    // Muat awal
    loadVideos();
  </script>

</body>
</html>
