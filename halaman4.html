<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Upload Video Pendek</title>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      padding: 20px;
    }

    #uploadBtn[disabled] {
      background-color: #ccc;
      cursor: not-allowed;
    }

    .spinner {
      display: inline-block;
      width: 30px;
      height: 30px;
      border: 4px solid rgba(0, 0, 0, 0.2);
      border-top-color: #3498db;
      border-radius: 50%;
      animation: spin 1s ease-in-out infinite;
      margin-top: 10px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <h2>Upload Video Pendek (seperti TikTok)</h2>
  <input type="file" id="upload" accept="video/*" />
  <br><br>
  <button id="uploadBtn" onclick="uploadVideo()">Unggah Video</button>
  
  <div id="status"></div>

  <script>
    async function uploadVideo() {
      const file = document.getElementById("upload").files[0];
      const btn = document.getElementById("uploadBtn");
      const status = document.getElementById("status");

      if (!file) {
        alert("Pilih video dulu!");
        return;
      }

      btn.disabled = true;
      status.innerHTML = `<div class="spinner"></div><p>Mengunggah video...</p>`;

      const formData = new FormData();
      formData.append("file", file);
      formData.append("upload_preset", "penanaman_preset");
      formData.append("folder", "video-penanaman");

      try {
        const response = await fetch("https://api.cloudinary.com/v1_1/dtl4uiytm/video/upload", {
          method: "POST",
          body: formData
        });
        const data = await response.json();

        status.innerHTML = `
          ✅ Sukses! Video berhasil diunggah.<br><br>
          <video width="300" controls src="${data.secure_url}"></video><br><br>
          <a href="${data.secure_url}" target="_blank">${data.secure_url}</a>
        `;
      } catch (err) {
        console.error(err);
        status.innerHTML = `<p style="color:red;">❌ Gagal mengunggah video.</p>`;
      }

      btn.disabled = false;
    }
  </script>
</body>
</html>
