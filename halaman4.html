<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Video Penanaman (Halaman 4)</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #e0f0ff;
      margin: 0;
      padding: 0;
    }

    header {
      background: #0077cc;
      color: white;
      padding: 15px;
      text-align: center;
      position: relative;
    }

    .icon-btn {
      position: absolute;
      top: 15px;
      font-size: 20px;
      background: white;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #uploadIcon {
      right: 15px;
    }

    #adminIcon {
      left: 15px;
    }

    .video-feed {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px;
    }

    .video-card {
      background: white;
      border-radius: 12px;
      padding: 15px;
      margin: 30px 0;
      width: 90%;
      max-width: 500px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      position: relative;
    }

    video {
      width: 100%;
      border-radius: 8px;
    }

    .view-count {
      font-size: 14px;
      color: #555;
      margin-top: 5px;
    }

    .comment-icon {
      position: absolute;
      top: 50%;
      right: 15px;
      transform: translateY(-50%);
      font-size: 28px;
      background: #ffffffcc;
      padding: 8px;
      border-radius: 50%;
      cursor: pointer;
      z-index: 1;
    }

    .comment-popup {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.8);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .comment-popup-content {
      background: white;
      padding: 20px;
      border-radius: 12px;
      width: 90%;
      max-width: 400px;
      max-height: 80%;
      overflow-y: auto;
    }

    .comment-popup-content input {
      width: 100%;
      margin: 5px 0;
      padding: 6px;
    }

    .delete-btn {
      position: absolute;
      bottom: 10px;
      right: 10px;
      background: #ff4444;
      color: white;
      border: none;
      padding: 5px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
    }

    #uploadPopup {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.7);
      justify-content: center;
      align-items: center;
      z-index: 2000;
    }

    #uploadPopupContent {
      background: white;
      padding: 20px;
      border-radius: 10px;
      max-width: 400px;
      width: 90%;
    }

    #uploadPopupContent input {
      width: 100%;
      margin: 5px 0;
      padding: 8px;
    }

    #uploadPopupContent button {
      padding: 8px 16px;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <header>
    <button id="adminIcon" class="icon-btn">🔐</button>
    <h1>📹 Video Penanaman Pendek</h1>
    <button id="uploadIcon" class="icon-btn" onclick="bukaUpload()">⏫</button>
  </header>

  <div class="video-feed" id="videoFeed">
    <p>Memuat video...</p>
  </div>

  <!-- Popup Komentar -->
  <div class="comment-popup" id="commentPopup">
    <div class="comment-popup-content">
      <h3>Komentar</h3>
      <div id="commentList"></div>
      <input id="namaKomentar" placeholder="Nama Anda" />
      <input id="isiKomentar" placeholder="Komentar Anda" />
      <button onclick="kirimKomentarTerbuka()">Kirim</button>
      <button onclick="tutupKomentar()">Tutup</button>
    </div>
  </div>

  <!-- Popup Upload -->
  <div id="uploadPopup">
    <div id="uploadPopupContent">
      <h3>Upload Video Baru</h3>
      <input type="text" id="judulVideo" placeholder="Judul Video" />
      <input type="file" id="videoFile" accept="video/*" />
      <button onclick="unggahVideo()">Unggah</button>
      <button onclick="tutupUpload()">Batal</button>
      <p id="statusUpload"></p>
    </div>
  </div>

  <script>
    const BIN_ID = "687085726063391d31ab3bd3";
    const API_KEY = "Bearer $2a$10$gAEzlF7LNkB9ykiLrrl3bODG6YkiqyLkFOPe9kTm.ZD7Gt2KmdgbK";
    const CLOUDINARY_UPLOAD_URL = "https://api.cloudinary.com/v1_1/dtl4uiytm/video/upload";
    const CLOUDINARY_PRESET = "penanaman_preset";

    let komentarIndex = null;
    let videosGlobal = [];

    function bukaKomentar(i) {
      komentarIndex = i;
      const komentarList = videosGlobal[i].comments || [];
      document.getElementById("commentList").innerHTML = komentarList.map(k => `💬 <strong>${k.nama}</strong>: ${k.pesan}`).join("<br>");
      document.getElementById("commentPopup").style.display = "flex";
    }

    function tutupKomentar() {
      document.getElementById("commentPopup").style.display = "none";
    }

    function bukaUpload() {
      document.getElementById("uploadPopup").style.display = "flex";
    }

    function tutupUpload() {
      document.getElementById("uploadPopup").style.display = "none";
    }

    async function kirimKomentarTerbuka() {
      const nama = document.getElementById("namaKomentar").value.trim();
      const pesan = document.getElementById("isiKomentar").value.trim();
      if (!nama || !pesan) return;

      const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
        headers: { "X-Master-Key": API_KEY }
      });
      const data = await res.json();
      const videos = data.record.videos;
      videos[komentarIndex].comments.push({ nama, pesan });

      await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
        method: "PUT",
        headers: {
          "Content-Type": "application/json",
          "X-Master-Key": API_KEY
        },
        body: JSON.stringify({ videos })
      });

      tutupKomentar();
      loadVideos();
    }

    async function unggahVideo() {
      const file = document.getElementById("videoFile").files[0];
      const title = document.getElementById("judulVideo").value.trim();
      const status = document.getElementById("statusUpload");
      if (!file || !title) return alert("Judul dan file wajib diisi");

      status.textContent = "⏳ Mengunggah video...";
      const form = new FormData();
      form.append("file", file);
      form.append("upload_preset", CLOUDINARY_PRESET);

      const res = await fetch(CLOUDINARY_UPLOAD_URL, {
        method: "POST",
        body: form
      });
      const data = await res.json();

      const videoBaru = {
        url: data.secure_url,
        title,
        views: 0,
        comments: []
      };

      const binRes = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
        headers: { "X-Master-Key": API_KEY }
      });
      const binData = await binRes.json();
      const videos = binData.record.videos || [];
      videos.unshift(videoBaru);

      await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
        method: "PUT",
        headers: {
          "Content-Type": "application/json",
          "X-Master-Key": API_KEY
        },
        body: JSON.stringify({ videos })
      });

      status.textContent = "✅ Video berhasil diunggah!";
      document.getElementById("judulVideo").value = "";
      document.getElementById("videoFile").value = "";
      tutupUpload();
      loadVideos();
    }

    async function loadVideos() {
      const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
        headers: { "X-Master-Key": API_KEY }
      });
      const data = await res.json();
      const videos = data.record.videos || [];
      videosGlobal = videos;

      const feed = document.getElementById("videoFeed");
      feed.innerHTML = "";

      videos.forEach((v, i) => {
        const card = document.createElement("div");
        card.className = "video-card";
        card.innerHTML = `
          <video src="${v.url}" controls onclick="tambahView(${i}, this)"></video>
          <div class="view-count">👁️ ${v.views || 0} views</div>
          <div class="comment-icon" onclick="bukaKomentar(${i})">💬</div>
        `;
        feed.appendChild(card);
      });
    }

    async function tambahView(i, video) {
      if (video.dataset.viewed === "true") return;
      video.dataset.viewed = "true";

      const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
        headers: { "X-Master-Key": API_KEY }
      });
      const data = await res.json();
      const videos = data.record.videos;
      videos[i].views = (videos[i].views || 0) + 1;

      await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
        method: "PUT",
        headers: {
          "Content-Type": "application/json",
          "X-Master-Key": API_KEY
        },
        body: JSON.stringify({ videos })
      });

      loadVideos();
    }

    loadVideos();
  </script>
</body>
</html>
