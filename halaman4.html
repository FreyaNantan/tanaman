<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Video Pendek Penanaman</title>
  <style>
    body {
      background-color: #e0f0ff;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 10px;
    }
    header {
      background-color: #3399ff;
      color: white;
      padding: 20px;
      text-align: center;
      border-radius: 8px;
    }
    .video-feed {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .video-card {
      background: #fff;
      padding: 15px;
      margin: 15px 0;
      border-radius: 12px;
      width: 95%;
      max-width: 450px;
      box-shadow: 0 0 12px rgba(0,0,0,0.1);
    }
    .video-card video {
      width: 100%;
      border-radius: 10px;
    }
    .komentar {
      margin-top: 10px;
    }
    .komentar textarea {
      width: 100%;
      border-radius: 6px;
      padding: 8px;
      border: 1px solid #ccc;
      margin-bottom: 5px;
    }
    .komentar button {
      background-color: #66cc66;
      color: white;
      border: none;
      padding: 8px 15px;
      border-radius: 6px;
      cursor: pointer;
    }
    .komentar-list {
      font-size: 14px;
      margin-top: 10px;
      background: #f3f3f3;
      padding: 8px;
      border-radius: 6px;
    }
    .upload-form {
      background: #ffffff;
      padding: 15px;
      border-radius: 12px;
      margin: 15px auto;
      max-width: 450px;
      box-shadow: 0 0 12px rgba(0,0,0,0.1);
    }
    input, textarea {
      width: 100%;
      padding: 8px;
      margin: 5px 0;
      border-radius: 6px;
      border: 1px solid #ccc;
    }
    button.upload-btn {
      background-color: #3399ff;
      color: white;
      padding: 10px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    .views {
      font-size: 14px;
      color: #555;
    }
  </style>
</head>
<body>

  <header>
    <h1>🎥 Video Penanaman</h1>
  </header>

  <!-- Form Upload -->
  <div class="upload-form">
    <h3>📤 Upload Video Baru</h3>
    <input type="text" id="judulVideo" placeholder="Judul Video" required />
    <input type="file" id="videoFile" accept="video/*" required />
    <button type="button" class="upload-btn" onclick="uploadVideo()">Unggah</button>
    <p id="uploadStatus"></p>
  </div>

  <!-- Feed -->
  <div class="video-feed" id="videoFeed">⏳ Memuat...</div>

  <script>
    const CLOUDINARY_UPLOAD_URL = "https://api.cloudinary.com/v1_1/dtl4uiytm/video/upload";
    const CLOUDINARY_PRESET = "penanaman_preset";
    const JSONBIN_URL = "https://api.jsonbin.io/v3/b/687085726063391d31ab3bd3";
    const JSONBIN_API_KEY = "Bearer $2a$10$gAEzlF7LNkB9ykiLrrl3bODG6YkiqyLkFOPe9kTm.ZD7Gt2KmdgbK";

    let semuaVideo = [];

    async function fetchVideoData() {
      const res = await fetch(JSONBIN_URL + "/latest", {
        headers: { "X-Master-Key": JSONBIN_API_KEY }
      });
      const json = await res.json();
      semuaVideo = json.record.videos || [];
      return semuaVideo;
    }

    async function saveVideoData(videos) {
      await fetch(JSONBIN_URL, {
        method: "PUT",
        headers: {
          "Content-Type": "application/json",
          "X-Master-Key": JSONBIN_API_KEY
        },
        body: JSON.stringify({ videos })
      });
    }

    async function uploadVideo() {
      const file = document.getElementById("videoFile").files[0];
      const title = document.getElementById("judulVideo").value.trim();
      const tombol = document.querySelector(".upload-btn");

      if (!file || !title) return alert("Judul dan video wajib diisi.");

      tombol.disabled = true;
      document.getElementById("uploadStatus").innerText = "⏳ Mengunggah video...";

      const form = new FormData();
      form.append("file", file);
      form.append("upload_preset", CLOUDINARY_PRESET);

      try {
        const res = await fetch(CLOUDINARY_UPLOAD_URL, {
          method: "POST",
          body: form
        });
        const data = await res.json();

        const videoObj = {
          url: data.secure_url,
          title,
          views: 0,
          comments: []
        };

        // Ambil data terbaru dari JSONBin sebelum simpan
        const latestVideos = await fetchVideoData();
        latestVideos.unshift(videoObj);
        await saveVideoData(latestVideos);
        semuaVideo = latestVideos;

        document.getElementById("uploadStatus").innerText = "✅ Unggah berhasil!";
        document.getElementById("judulVideo").value = "";
        document.getElementById("videoFile").value = "";
        tambahkanSatuVideo(videoObj, 0);
      } catch (err) {
        document.getElementById("uploadStatus").innerText = "❌ Gagal mengunggah.";
        console.error(err);
      } finally {
        tombol.disabled = false;
      }
    }

    function tambahkanSatuVideo(video, index) {
      const feed = document.getElementById("videoFeed");
      const wrapper = document.createElement("div");
      wrapper.className = "video-card";
      wrapper.innerHTML = `
        <h4>${video.title}</h4>
        <video controls onclick="tambahView(${index})">
          <source src="${video.url}" type="video/mp4">
        </video>
        <p class="views" id="views-${index}">👁️ Dilihat: ${video.views}</p>
        <div class="komentar">
          <textarea id="komentar-${index}" placeholder="Tulis komentar..."></textarea>
          <button type="button" onclick="kirimKomentar(${index})">Kirim</button>
          <div class="komentar-list" id="list-${index}">
            ${video.comments.map(k => `🗨️ ${k}`).join("<br>")}
          </div>
        </div>
      `;
      feed.insertBefore(wrapper, feed.firstChild);
    }

    async function tampilkanVideo() {
      const feed = document.getElementById("videoFeed");
      feed.innerHTML = "⏳ Memuat...";
      const videos = await fetchVideoData();
      feed.innerHTML = "";
      videos.forEach((video, index) => {
        tambahkanSatuVideo(video, index);
      });
    }

    async function kirimKomentar(i) {
      const textarea = document.getElementById(`komentar-${i}`);
      const pesan = textarea.value.trim();
      if (!pesan) return;

      semuaVideo[i].comments.push(pesan);
      await saveVideoData(semuaVideo);

      const list = document.getElementById(`list-${i}`);
      list.innerHTML = semuaVideo[i].comments.map(k => `🗨️ ${k}`).join("<br>");
      textarea.value = "";
    }

    async function tambahView(i) {
      const key = "viewed_" + i;
      if (localStorage.getItem(key)) return;

      semuaVideo[i].views++;
      localStorage.setItem(key, "1");
      await saveVideoData(semuaVideo);
      document.getElementById(`views-${i}`).innerText = `👁️ Dilihat: ${semuaVideo[i].views}`;
    }

    tampilkanVideo();
  </script>
</body>
</html>
