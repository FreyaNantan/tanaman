<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Video Penanaman (Halaman 4)</title>
  <style>
    /* ...style sama seperti sebelumnya...*/
  </style>
</head>
<body>
  <header>
    <button id="adminIcon" class="icon-btn">🔐</button>
    <h1>📹 Video Penanaman Pendek</h1>
    <button id="uploadIcon" class="icon-btn">⏫</button>
  </header>

  <div class="video-feed" id="videoFeed">
    <p>Memuat video...</p>
  </div>

  <!-- Komentar Popup -->
  <div class="comment-popup" id="commentPopup">
    <div class="comment-popup-content">
      <h3>Komentar</h3>
      <div id="commentList"></div>
      <input id="namaKomentar" placeholder="Nama Anda" />
      <input id="isiKomentar" placeholder="Komentar Anda" />
      <button onclick="kirimKomentarTerbuka()">Kirim</button>
      <button onclick="tutupKomentar()">Tutup</button>
    </div>
  </div>

  <!-- Admin & Upload Popup (sesuaikan bila perlu) -->
  <div class="admin-popup" id="adminPopup">
    <div class="admin-popup-content">
      <h3>Masuk Admin</h3>
      <input type="password" id="adminPassword" placeholder="Password Admin" />
      <button onclick="verifikasiAdmin()">Masuk</button>
      <button onclick="tutupAdminPopup()">Batal</button>
    </div>
  </div>

  <div id="uploadPopup">
    <div id="uploadPopupContent">
      <h3>Upload Video Baru</h3>
      <input type="text" id="judulVideo" placeholder="Judul Video" />
      <input type="file" id="videoFile" accept="video/*" />
      <button onclick="unggahVideo()">Unggah</button>
      <button onclick="tutupUpload()">Batal</button>
      <p id="statusUpload"></p>
    </div>
  </div>

  <script>
    const BIN_ID = "687085726063391d31ab3bd3";
    const API_KEY = "Bearer $2a$10$gAEzlF7LNkB9ykiLrrl3bODG6YkiqyLkFOPe9kTm.ZD7Gt2KmdgbK";
    const CLOUDINARY_UPLOAD_URL = "https://api.cloudinary.com/v1_1/dtl4uiytm/video/upload";
    const CLOUDINARY_PRESET = "penanaman_preset";

    let videosGlobal = [];
    let komentarIndex = null;
    let isAdmin = false;

    document.getElementById("uploadIcon").onclick = () => document.getElementById("uploadPopup").style.display = "flex";
    document.getElementById("adminIcon").onclick = () => document.getElementById("adminPopup").style.display = "flex";
    function tutupAdminPopup() { document.getElementById("adminPopup").style.display = "none"; }
    function tutupUpload() { document.getElementById("uploadPopup").style.display = "none"; }

    window.onload = loadVideos;

    async function loadVideos() {
      const feed = document.getElementById("videoFeed");
      feed.innerHTML = `<p>Memuat video...</p>`;

      const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
        headers: { "X-Master-Key": API_KEY }
      });
      const data = await res.json();
      videosGlobal = data.record.videos || [];

      feed.innerHTML = "";
      videosGlobal.forEach((v, i) => {
        const div = document.createElement("div");
        div.className = "video-card" + (isAdmin ? " show-delete" : "");
        div.innerHTML = `
          <video controls src="${v.url}" onclick="tambahView(${i}, this)"></video>
          <div class="view-count">👁️ ${v.views || 0} views</div>
          <div class="comment-icon" onclick="bukaKomentar(${i})">💬</div>
          ${isAdmin ? `<button class="delete-btn" onclick="hapusVideo(${i})">🗑️</button>` : ""}
        `;
        feed.appendChild(div);
      });
    }

    async function tambahView(i, videoEl) {
      if (videoEl.dataset.viewed === "true") return;
      videoEl.dataset.viewed = "true";

      const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, { headers: { "X-Master-Key": API_KEY } });
      const data = await res.json();
      const videos = data.record.videos;
      videos[i].views = (videos[i].views || 0) + 1;

      await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
        method: "PUT",
        headers: { "Content-Type": "application/json", "X-Master-Key": API_KEY },
        body: JSON.stringify({ videos })
      });
      loadVideos();
    }

    function bukaKomentar(i) {
      komentarIndex = i;
      const c = videosGlobal[i].comments || [];
      document.getElementById("commentList").innerHTML = c.map(x =>
        `💬 <strong>${x.nama}</strong>: ${x.pesan}`
      ).join("<br>");
      document.getElementById("commentPopup").style.display = "flex";
    }

    function tutupKomentar() {
      document.getElementById("commentPopup").style.display = "none";
      document.getElementById("namaKomentar").value = "";
      document.getElementById("isiKomentar").value = "";
    }

    async function kirimKomentarTerbuka() {
      const nama = document.getElementById("namaKomentar").value.trim();
      const pesan = document.getElementById("isiKomentar").value.trim();
      if (!nama || !pesan) return;

      const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, { headers: { "X-Master-Key": API_KEY } });
      const data = await res.json();
      const vs = data.record.videos;
      vs[komentarIndex].comments.push({ nama, pesan });

      await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
        method: "PUT",
        headers: { "Content-Type": "application/json", "X-Master-Key": API_KEY },
        body: JSON.stringify({ videos: vs })
      });
      loadVideos();
      document.getElementById("isiKomentar").value = "";
    }

    async function verifikasiAdmin() {
      const pw = document.getElementById("adminPassword").value;
      if (pw === "admin54321") {
        isAdmin = true;
        alert("Berhasil masuk sebagai admin");
        tutupAdminPopup();
        loadVideos();
      } else alert("Password salah!");
    }

    async function unggahVideo() {
      const file = document.getElementById("videoFile").files[0];
      const title = document.getElementById("judulVideo").value.trim();
      if (!file || !title) return alert("Judul & file wajib diisi!");

      try {
        const fd = new FormData();
        fd.append("file", file);
        fd.append("upload_preset", CLOUDINARY_PRESET);
        const r = await fetch(CLOUDINARY_UPLOAD_URL, { method: "POST", body: fd });
        const data = await r.json();
        const obj = { url: data.secure_url, title, views: 0, comments: [] };

        const bin = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, { headers: { "X-Master-Key": API_KEY } });
        const j = await bin.json();
        const arr = j.record.videos || [];
        arr.unshift(obj);
        await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
          method: "PUT",
          headers: { "Content-Type": "application/json", "X-Master-Key": API_KEY },
          body: JSON.stringify({ videos: arr })
        });
        tutupUpload();
        loadVideos();
      } catch (e) { alert("Upload gagal!"); }
    }

    async function hapusVideo(i) {
      if (!confirm("Yakin ingin hapus?")) return;
      const bin = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, { headers: { "X-Master-Key": API_KEY } });
      const j = await bin.json();
      const arr = j.record.videos;
      arr.splice(i, 1);
      await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
        method: "PUT",
        headers: { "Content-Type": "application/json", "X-Master-Key": API_KEY },
        body: JSON.stringify({ videos: arr })
      });
      loadVideos();
    }
  </script>
</body>
</html>
