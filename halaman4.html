<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Video Pendek Penanaman</title>
  <style>
    body {
      background-color: #e0f0ff;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 10px;
    }

    header {
      background-color: #3399ff;
      color: white;
      text-align: center;
      padding: 20px;
    }

    .upload-container, .feed-container {
      max-width: 500px;
      margin: 20px auto;
      background: white;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 0 12px rgba(0,0,0,0.1);
    }

    input, textarea, button {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      box-sizing: border-box;
      border-radius: 8px;
      border: 1px solid #ccc;
    }

    video {
      width: 100%;
      border-radius: 8px;
      margin-top: 10px;
    }

    .video-item {
      margin-bottom: 30px;
    }

    .comment {
      background: #f0f8ff;
      padding: 8px;
      margin-top: 5px;
      border-radius: 8px;
    }

    .loading {
      text-align: center;
      color: #777;
      margin-top: 10px;
    }
  </style>
</head>
<body>

<header>
  <h2>📹 Video Pendek Penanaman</h2>
</header>

<div class="upload-container">
  <h3>📤 Unggah Video</h3>
  <input type="file" id="videoFile" accept="video/*">
  <input type="text" id="judul" placeholder="Judul video">
  <textarea id="deskripsi" placeholder="Deskripsi video"></textarea>
  <button onclick="unggahVideo()">Unggah</button>
  <p class="loading" id="statusUpload"></p>
</div>

<div class="feed-container">
  <h3>🌀 Feed Video</h3>
  <div id="videoFeed"></div>
</div>

<!-- Script -->
<script>
const cloudName = "dtl4uiytm";
const uploadPreset = "penanaman_preset";
const binId = "687085726063391d31ab3bd3";
const apiKey = "$2a$10$gAEzlF7LNkB9ykiLrrl3bODG6YkiqyLkFOPe9kTm.ZD7Gt2KmdgbK";
const videoFeed = document.getElementById("videoFeed");
const statusUpload = document.getElementById("statusUpload");

// Upload video ke Cloudinary dan simpan ke JSONBin
async function unggahVideo() {
  const file = document.getElementById("videoFile").files[0];
  const judul = document.getElementById("judul").value;
  const deskripsi = document.getElementById("deskripsi").value;

  if (!file || !judul) return alert("Pilih video dan isi judul!");

  statusUpload.textContent = "⏳ Mengunggah ke Cloudinary...";
  const formData = new FormData();
  formData.append("file", file);
  formData.append("upload_preset", uploadPreset);
  formData.append("folder", "video-penanaman");

  try {
    const cloudRes = await fetch(`https://api.cloudinary.com/v1_1/${cloudName}/video/upload`, {
      method: "POST",
      body: formData
    });
    const cloudData = await cloudRes.json();
    const videoURL = cloudData.secure_url;

    const videoObj = {
      id: Date.now(),
      url: videoURL,
      judul,
      deskripsi,
      views: 0,
      komentar: []
    };

    // Ambil data lama dari JSONBin
    const getRes = await fetch(`https://api.jsonbin.io/v3/b/${binId}/latest`, {
      headers: { "X-Master-Key": apiKey }
    });
    const data = await getRes.json();
    const videoList = data.record || [];

    // Tambah video baru dan simpan kembali
    videoList.unshift(videoObj);

    await fetch(`https://api.jsonbin.io/v3/b/${binId}`, {
      method: "PUT",
      headers: {
        "Content-Type": "application/json",
        "X-Master-Key": apiKey
      },
      body: JSON.stringify(videoList)
    });

    statusUpload.textContent = "✅ Video berhasil diunggah!";
    tampilkanFeed();
  } catch (e) {
    console.error(e);
    statusUpload.textContent = "❌ Gagal mengunggah video.";
  }
}

// Tampilkan feed video
async function tampilkanFeed() {
  videoFeed.innerHTML = "⏳ Memuat video...";
  try {
    const res = await fetch(`https://api.jsonbin.io/v3/b/${binId}/latest`, {
      headers: { "X-Master-Key": apiKey }
    });
    const data = await res.json();
    const videos = data.record;

    videoFeed.innerHTML = "";
    videos.forEach((v, i) => {
      const div = document.createElement("div");
      div.className = "video-item";
      div.innerHTML = `
        <h4>${v.judul}</h4>
        <p>${v.deskripsi}</p>
        <video src="${v.url}" controls></video>
        <p>👁️ Views: ${v.views}</p>
        <div>
          <input type="text" id="komentar-${v.id}" placeholder="Tulis komentar...">
          <button onclick="kirimKomentar(${v.id})">💬 Kirim</button>
        </div>
        <div id="daftarKomentar-${v.id}">
          ${v.komentar.map(k => `<div class="comment">${k}</div>`).join("")}
        </div>
      `;
      videoFeed.appendChild(div);
    });
  } catch (e) {
    videoFeed.innerHTML = "⚠️ Gagal memuat video.";
    console.error(e);
  }
}

// Kirim komentar
async function kirimKomentar(id) {
  const input = document.getElementById("komentar-" + id);
  const isi = input.value.trim();
  if (!isi) return;

  try {
    const res = await fetch(`https://api.jsonbin.io/v3/b/${binId}/latest`, {
      headers: { "X-Master-Key": apiKey }
    });
    const data = await res.json();
    const videoList = data.record;

    const index = videoList.findIndex(v => v.id === id);
    if (index !== -1) {
      videoList[index].komentar.push(isi);
    }

    await fetch(`https://api.jsonbin.io/v3/b/${binId}`, {
      method: "PUT",
      headers: {
        "Content-Type": "application/json",
        "X-Master-Key": apiKey
      },
      body: JSON.stringify(videoList)
    });

    tampilkanFeed();
  } catch (e) {
    console.error("Gagal kirim komentar", e);
  }
}

// Jalankan saat halaman dibuka
tampilkanFeed();
</script>

</body>
</html>
